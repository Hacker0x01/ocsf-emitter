name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (unit)
        # Exclude the OCSF-schema conformance test; it runs as its own job (it
        # fetches schemas from schema.ocsf.io and needs network access).
        run: uv run pytest -q --ignore=tests/test_integ_ocsf_schema.py

  ocsf-schema-validation:
    name: OCSF 1.5 schema conformance (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync

      # Validates one emitted event per supported class against the official
      # OCSF JSON Schema fetched from schema.ocsf.io for the pinned version.
      # OCSF_SCHEMA_VALIDATION=1 turns the otherwise-skipped test into a hard run.
      - name: Validate emitted events against the OCSF schema
        env:
          OCSF_SCHEMA_VALIDATION: "1"
        run: uv run pytest -q tests/test_integ_ocsf_schema.py -v
