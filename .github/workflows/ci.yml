name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest (unit)
        # Exclude the network-gated schema tests; they run as their own job (they
        # fetch the OCSF metaschema and need network access).
        run: >-
          uv run pytest -q
          --ignore=tests/test_integ_ocsf_schema.py
          --ignore=tests/test_schema_completeness.py

  ocsf-schema-validation:
    name: OCSF 1.5 schema conformance + completeness (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync

      # Two checks against the OCSF 1.5 metaschema (via ocsf-lib), constraints
      # enforced: (1) every emitted class conforms; (2) our coverage is complete
      # and accurate (all base classes, identities, activity enums, observables).
      # OCSF_SCHEMA_VALIDATION=1 turns the otherwise-skipped tests into hard runs.
      - name: Validate coverage + conformance against the OCSF schema
        env:
          OCSF_SCHEMA_VALIDATION: "1"
        run: >-
          uv run pytest -q -v
          tests/test_integ_ocsf_schema.py
          tests/test_schema_completeness.py
