site_name: ocsf-emitter
site_description: Construct, validate, and emit OCSF 1.5.0 events across supported classes (Detection Finding, Authentication, File Hosting Activity, and more)
# Update these if the repository lives under a different owner/name.
site_url: https://hacker0x01.github.io/ocsf-emitter/
repo_url: https://github.com/Hacker0x01/ocsf-emitter
repo_name: Hacker0x01/ocsf-emitter
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"
          inventories:
            - https://docs.python.org/3/objects.inv

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Usage guide: usage.md
  - API reference:
      - Builders: api/builders.md
      - Domain types: api/domain.md
      - Defaults & mappings: api/defaults.md
      - Validation: api/validate.md
      - Emit: api/emit.md
      - Errors: api/errors.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hacker0x01/ocsf-emitter
